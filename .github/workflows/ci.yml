name: Dayflow CI

on:
  push:
    paths:
      - "client/**"
      - "server/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dayflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  PYTHONUNBUFFERED: "1"

jobs:
  server:
    name: Python API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run API, storage, authentication and sync tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Run local preview proxy tests
        working-directory: .
        run: python -m unittest discover -s scripts -p test_preview.py -v
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dayflow-server-test-results
          path: server/test-results.xml
          if-no-files-found: warn
          retention-days: 14

  clients:
    name: Flutter ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
            artifact: client/build/windows/x64/runner/Release/
          - target: web
            runner: ubuntu-latest
            artifact: client/build/web/
          - target: android-debug
            runner: ubuntu-latest
            artifact: client/build/app/outputs/flutter-apk/app-debug.apk
          - target: ios-simulator
            runner: macos-latest
            artifact: client/dayflow-ios-simulator.tar.gz
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java for Android
        if: matrix.target == 'android-debug'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            client/android/*.gradle.kts
            client/android/app/*.gradle.kts
            client/android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Show toolchain version
        run: flutter --version
      - name: Resolve client dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Run core and widget tests
        run: flutter test --no-pub
      - name: Verify Web update and offline startup
        if: matrix.target == 'web'
        run: node --test test/web_bootstrap_test.cjs
      - name: Build Windows release bundle
        if: matrix.target == 'windows'
        run: flutter build windows --release --no-pub
      - name: Build same-origin Web release
        if: matrix.target == 'web'
        run: flutter build web --release --no-pub
      - name: Build Android development APK
        if: matrix.target == 'android-debug'
        run: flutter build apk --debug --no-pub
      - name: Build unsigned iOS simulator app
        if: matrix.target == 'ios-simulator'
        run: flutter build ios --simulator --debug --no-codesign --no-pub
      - name: Preserve simulator executable permissions
        if: matrix.target == 'ios-simulator'
        run: tar -czf dayflow-ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app
      - name: Keep build output
        uses: actions/upload-artifact@v7
        with:
          name: dayflow-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
